---
# CoreDNS External DNS Server Configuration
# =============================================================================

# Domain to serve
dns_domain: "engatwork.com"

# =============================================================================
# MetalLB Configuration
# =============================================================================
metallb_version: "0.14.8"
metallb_ip_pool: "10.10.1.200-10.10.1.220"
metallb_pool_name: "default-pool"

# =============================================================================
# CoreDNS Configuration
# =============================================================================
coredns_version: "1.11.3"
coredns_namespace: "dns"
coredns_replicas: 2

# LoadBalancer IP for CoreDNS (first available from pool)
coredns_lb_ip: "10.10.1.200"

# Upstream DNS servers for external resolution
upstream_dns:
  - "8.8.8.8"
  - "8.8.4.4"

# =============================================================================
# DNS Records
# Add your infrastructure records here
# =============================================================================
dns_records:
  # pfSense Gateway
  - ip: "192.168.0.101"
    hostnames:
      - "pfsense"
      - "gateway"
      - "firewall"

  # oVirt Engine
  - ip: "192.168.0.105"
    hostnames:
      - "ovirt"
      - "engine"
      - "virt"

  # Kubernetes Control Plane
  - ip: "10.10.1.101"
    hostnames:
      - "mgmt-core-01"
      - "k8s"
      - "kubernetes"
      - "api"

  # Kubernetes Workers
  - ip: "10.10.1.102"
    hostnames:
      - "mgmt-core-02"

  - ip: "10.10.1.103"
    hostnames:
      - "mgmt-core-03"

  # CoreDNS itself
  - ip: "10.10.1.200"
    hostnames:
      - "dns"
      - "ns1"

  # mgmt-forge Kubernetes nodes (VLAN 14, 10.10.5.0/24)
  - ip: "10.10.5.103"
    hostnames:
      - "mgmt-forge-01"
  - ip: "10.10.5.104"
    hostnames:
      - "mgmt-forge-02"
  - ip: "10.10.5.105"
    hostnames:
      - "mgmt-forge-03"

  # mgmt-forge ingress VIP (MetalLB)
  - ip: "10.10.5.201"
    hostnames:
      - "ingress.mgmt-forge"

  # mgmt-control Kubernetes nodes (VLAN 11, 10.10.2.0/24) — replaces OKD
  - ip: "10.10.2.110"
    hostnames:
      - "mgmt-control-01"
  - ip: "10.10.2.111"
    hostnames:
      - "mgmt-control-02"
  - ip: "10.10.2.112"
    hostnames:
      - "mgmt-control-03"

  # mgmt-control ingress VIP (MetalLB pool .200-.210)
  - ip: "10.10.2.200"
    hostnames:
      - "ingress.mgmt-control"

  # mgmt-workload Kubernetes node (VLAN 11, single-node)
  - ip: "10.10.2.120"
    hostnames:
      - "mgmt-workload-01"

  # mgmt-workload ingress VIP (MetalLB pool .211-.220)
  - ip: "10.10.2.211"
    hostnames:
      - "ingress.mgmt-workload"

# =============================================================================
# Wildcard DNS Records
# =============================================================================
wildcard_records:
  # Forge cluster apps: *.apps.mgmt-forge.engatwork.com → ingress-nginx VIP
  - zone: "apps.mgmt-forge"
    ip: "10.10.5.201"

  # mgmt-control apps: *.apps.mgmt-control.engatwork.com → ingress-nginx VIP
  - zone: "apps.mgmt-control"
    ip: "10.10.2.200"

  # mgmt-workload apps: *.apps.mgmt-workload.engatwork.com → ingress-nginx VIP
  - zone: "apps.mgmt-workload"
    ip: "10.10.2.211"

# =============================================================================
# Kubeconfig (path on control plane node)
# =============================================================================
kubeconfig_path: "/etc/kubernetes/admin.conf"
