---
# Kubernetes Bootstrap - Common Configuration
# =============================================================================
# This file contains settings shared across ALL cluster deployments.
# Cluster-specific settings are in separate files (mgmt_core.yml, etc.)
#
# Select cluster type by using the appropriate inventory file:
#   ansible-playbook -i inventory/mgmt-core.ini bootstrap-k8s.yml
#   ansible-playbook -i inventory/mgmt-devops.ini bootstrap-k8s.yml
#   ansible-playbook -i inventory/mgmt-observability.ini bootstrap-k8s.yml

# =============================================================================
# KUBERNETES VERSION
# =============================================================================
# Check releases: https://kubernetes.io/releases/
k8s_version: "1.31"
k8s_full_version: "1.31.4"

# =============================================================================
# CONTAINER RUNTIME
# =============================================================================
container_runtime: "containerd"
containerd_version: "1.7.24"
cni_plugins_version: "1.6.0"
runc_version: "1.2.3"

# =============================================================================
# CNI (NETWORK PLUGIN)
# =============================================================================
# Options: flannel, calico
cni_plugin: "flannel"
flannel_version: "0.26.1"
calico_version: "3.29.1"

# =============================================================================
# NODE CONFIGURATION
# =============================================================================
disable_swap: true

kernel_modules:
  - overlay
  - br_netfilter

sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  # MetalLB L2 mode: Disable ICMP redirects to prevent VIP routing issues
  # When VIP is on same subnet as host, kernel sends redirects which breaks L2
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0

# =============================================================================
# FIREWALL PORTS
# =============================================================================
control_plane_ports:
  - 6443/tcp    # Kubernetes API server
  - 2379/tcp    # etcd client
  - 2380/tcp    # etcd peer
  - 10250/tcp   # Kubelet API
  - 10259/tcp   # kube-scheduler
  - 10257/tcp   # kube-controller-manager

worker_ports:
  - 10250/tcp   # Kubelet API
  - 10256/tcp   # kube-proxy
  - 30000-32767/tcp  # NodePort Services

flannel_ports:
  - 8472/udp    # VXLAN

# =============================================================================
# ADDITIONAL COMPONENTS
# =============================================================================
install_bash_completion: true
install_helm: true
helm_version: "3.16.3"
install_metrics_server: true

# =============================================================================
# CLUSTER DEFAULTS (can be overridden in cluster-specific vars)
# =============================================================================
cluster_domain: "cluster.local"
token_ttl: "24h"

# =============================================================================
# DOMAIN SETTINGS
# =============================================================================
dns_domain: "engatwork.com"

# =============================================================================
# ARGOCD REGISTRATION (Phase 8)
# =============================================================================
# Set argocd_register=false to skip Phase 8 on a given cluster (e.g. mgmt-core,
# mgmt-storage — foundational clusters we deliberately don't manage via GitOps).
argocd_register: true

# ArgoCD namespaces to register the cluster with.
# One cluster Secret will be created per entry. Both instances run on
# mgmt-control (vanilla helm install; replaces OperatorHub'd OKD).
argocd_instances:
  - argocd-sre
  - argocd-devops

# Kubeconfig on the control host that has admin access to the cluster
# where ArgoCD runs (mgmt-control). The kubeadm bootstrap deposits this
# at /root/.kube/mgmt-control after Phase 7 (kubeconfig fetch).
argocd_kubeconfig: "/root/.kube/mgmt-control"

# Labels applied to every ArgoCD cluster Secret (merged with per-cluster labels).
# These support ApplicationSet cluster-generator selectors.
cluster_labels_defaults:
  managed-by: k8s-bstrp
  k8s-version: "1.31.4"
