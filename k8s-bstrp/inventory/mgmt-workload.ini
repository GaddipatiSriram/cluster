# Kubernetes Cluster Inventory - Management Workload
# =============================================================================
# Workload-plane cluster: ARC runners, ephemeral workloads, Pattern A baseline.
# Co-located with OKD on VLAN 11 (Mgmt-DevOps-Net, 10.10.2.0/24).
#
# Single-node topology — control plane is also schedulable for workloads.
# When the 2nd oVirt host arrives, expand to 1 CP + N workers.
#
# Usage:
#   ansible-playbook -i inventory/mgmt-workload.ini bootstrap-k8s.yml

[k8s_first_control_plane]
mgmt-workload-01    ansible_host=10.10.2.120    k8s_role=control_plane

[k8s_control_plane:children]
k8s_first_control_plane

[k8s_workers]
# (intentionally empty — single-node cluster)

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[k8s_cluster:vars]
ansible_user=root
ansible_password=unix
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
cluster_vars_file=mgmt_workload
