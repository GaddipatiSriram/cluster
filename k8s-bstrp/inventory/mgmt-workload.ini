# Kubernetes Cluster Inventory - Management Workload
# =============================================================================
# Workload-plane cluster: ARC controller + runners, ephemeral workloads,
# Pattern A baseline. Co-located with mgmt-control on VLAN 11
# (Mgmt-DevOps-Net, 10.10.2.0/24).
#
# 3-node HA topology — etcd quorum survives one node loss. Tight 8 GiB
# per node (vm_size: workload preset) to fit alongside mgmt-control
# within the single-host memory budget.
#
# Note: this inventory is reference / parameter map. The actual cluster
# bootstrap is GitOps-driven (Crossplane / CAPI on mgmt-control), not
# `ansible-playbook bootstrap-k8s.yml`. Kept here so the imperative
# path remains available for DR and so the parameter set has one
# canonical source.

[k8s_first_control_plane]
mgmt-workload-01    ansible_host=10.10.2.120    k8s_role=control_plane

[k8s_control_plane:children]
k8s_first_control_plane

[k8s_workers]
mgmt-workload-02    ansible_host=10.10.2.121    k8s_role=worker
mgmt-workload-03    ansible_host=10.10.2.122    k8s_role=worker

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[k8s_cluster:vars]
ansible_user=root
ansible_password=unix
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
cluster_vars_file=mgmt_workload
