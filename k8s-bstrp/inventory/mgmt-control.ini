# Kubernetes Cluster Inventory - Management Control Plane
# =============================================================================
# Control-plane cluster: ArgoCD SRE+DevOps, Argo Workflows, Jenkins, Crossplane,
# Backstage. Replaces the OKD compact 3-node cluster. Co-located with
# mgmt-workload on VLAN 11 (Mgmt-DevOps-Net, 10.10.2.0/24).
#
# 3-node HA topology — etcd quorum survives one node loss. The control plane
# is durable infrastructure (long-lived, low-traffic, controllers); the
# workload plane (mgmt-workload) handles ephemeral / bursty load.
#
# Usage:
#   ansible-playbook -i inventory/mgmt-control.ini bootstrap-k8s.yml
#
# After kubeadm init succeeds, install ArgoCD via:
#   helm install argocd-sre    cplanes/control/argo-cd/ -f values-sre.yaml    -n argocd-sre
#   helm install argocd-devops cplanes/control/argo-cd/ -f values-devops.yaml -n argocd-devops

[k8s_first_control_plane]
mgmt-control-01    ansible_host=10.10.2.110    k8s_role=control_plane

[k8s_control_plane:children]
k8s_first_control_plane

[k8s_workers]
mgmt-control-02    ansible_host=10.10.2.111    k8s_role=worker
mgmt-control-03    ansible_host=10.10.2.112    k8s_role=worker

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[k8s_cluster:vars]
ansible_user=root
ansible_password=unix
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
cluster_vars_file=mgmt_control
