# Kubernetes Cluster Inventory - Management Forge
# =============================================================================
# Software forge cluster: GitLab, Harbor, SonarQube
# Network: Mgmt-Forge-Net (VLAN 14, 10.10.5.0/24)
#
# Usage:
#   ansible-playbook -i inventory/mgmt-forge.ini bootstrap-k8s.yml

[k8s_first_control_plane]
mgmt-forge-01    ansible_host=10.10.5.103    k8s_role=control_plane

[k8s_control_plane:children]
k8s_first_control_plane

[k8s_workers]
mgmt-forge-02    ansible_host=10.10.5.104    k8s_role=worker
mgmt-forge-03    ansible_host=10.10.5.105    k8s_role=worker

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[k8s_cluster:vars]
ansible_user=root
ansible_password=unix
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
cluster_vars_file=mgmt_forge
