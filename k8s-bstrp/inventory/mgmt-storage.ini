# Kubernetes Cluster Inventory - Management Storage
# =============================================================================
# Storage cluster: Rook-Ceph (operator + cluster). Provides RBD/CephFS/RGW
# to every workload-capable cluster via rook-ceph-external bundles.
# Network: Mgmt-Storage-Net (VLAN 13, 10.10.4.0/24)
#
# Phase 8 only — bootstrap was historically done out-of-band; this file
# exists so re-onboarding (registering with a new ArgoCD-host) goes
# through the standard Phase 8 path instead of manual kubectl apply.
#
# Usage:
#   ansible-playbook -i inventory/mgmt-storage.ini bootstrap-k8s.yml --tags phase8

[k8s_first_control_plane]
mgmt-storage-01    ansible_host=10.10.4.100    k8s_role=control_plane

[k8s_control_plane:children]
k8s_first_control_plane

[k8s_workers]
mgmt-storage-02    ansible_host=10.10.4.101    k8s_role=worker
mgmt-storage-03    ansible_host=10.10.4.102    k8s_role=worker

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[k8s_cluster:vars]
ansible_user=root
ansible_password=unix
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
cluster_vars_file=mgmt_storage
